# AI PM input: milestones and backlog for Cloud Cost Anomaly Radar.
# status: done | in_progress | planned      backlog status: todo | doing | done
project: Cloud Cost Anomaly Radar

milestones:
  - id: M1
    name: Synthetic multi-cloud billing generator
    due: 2026-10-19
    status: done
    done_criteria: 365 days x 54 series with trend, weekly and month-end seasonality, noise, 12 labelled anomalies saved with ground truth
  - id: M2
    name: Detector ensemble and evaluation
    due: 2026-10-26
    status: done
    done_criteria: Rolling MAD, seasonal residual and Isolation Forest detectors; event-level precision/recall/F1 with +/-2 day tolerance
  - id: M3
    name: Root-cause attribution and savings estimate
    due: 2026-10-30
    status: done
    done_criteria: Each flagged event ranked by provider/account/service delta vs baseline, with dollar excess
  - id: M4
    name: FinOps report, charts and AI PM
    due: 2026-11-02
    status: done
    done_criteria: reports/finops_report.md, reports/summary.json, four brand charts, weekly AI PM workflow
  - id: M5
    name: Cost-forecast extension
    due: 2026-12-14
    status: planned
    done_criteria: 30-day spend forecast per provider with backtested MAPE and a budget-breach early warning
  - id: M6
    name: Slack alert integration
    due: 2027-01-25
    status: planned
    done_criteria: Anomaly alerts posted to Slack with driver, excess and runbook link; planned events suppressed

